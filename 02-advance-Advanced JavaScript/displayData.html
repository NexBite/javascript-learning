<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User List on Click</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button {
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .user-card {
      border: 1px solid #ccc;
      padding: 10px 15px;
      margin-bottom: 10px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- Button to trigger the fetch request -->
  <button id="load-btn">Load Users</button>

  <!-- Container for displayed data -->
  <div id="user-list"></div>

  <script>
    async function getUsers() {
      const container = document.getElementById("user-list");
      const button = document.getElementById("load-btn");

      // UI Feedback: Indicate loading state
      container.innerHTML = "Loading...";
      button.disabled = true;

      try {
        const response = await fetch("https://jsonplaceholder.typicode.com/users");
        if (!response.ok) {
          throw new Error(`HTTP error! Status: ${response.status}`);
        }
        const users = await response.json();

        // Render users to HTML
        container.innerHTML = users.map(user => `
          <div class="user-card">
            <h3>${user.name}</h3>
            <p>Email: ${user.email}</p>
          </div>
        `).join("");

      } catch (error) {
        container.innerHTML = `<p style="color: red;">Failed to load users: ${error.message}</p>`;
        console.error("Fetch error:", error.message);
      } finally {
        button.disabled = false;
        console.log("Request completed");
      }
    }

    // Attach click listener to the button
    document.getElementById("load-btn").addEventListener("click", getUsers);
  </script>
</body>
</html>
